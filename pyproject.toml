[project]
name = "PKGNAME"
version = "0.1.0"
description = "TODO: one-line description"
authors = [
    { name = "Bruce Oberg", email = "bruce@oberg.org" }
]
requires-python = ">=3.13"
dependencies = [
]

# Entry point: `uv run PKGNAME` or just `PKGNAME` inside the devenv shell.
# The CLI name (left of `=`) and the import path (right) both derive from
# the package name; update both if you rename the project.
[project.scripts]
PKGNAME = "PKGNAME.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/PKGNAME"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "mypy>=1.0",
]

[tool.mypy]
files = ["src"]
strict = true
