[project]
name = "wac_homekit"
version = "0.1.0"
description = "Apple HomeKit bridge to WAC lighting devices"
authors = [
    { name = "Bruce Oberg", email = "bruce@oberg.org" }
]
requires-python = ">=3.13"
dependencies = [
    "hap-python>=5.0.0",
    "wac-iot[discovery]",
]

# Entry point: `uv run wac_homekit` or just `wac_homekit` inside the devenv shell.
# The CLI name (left of `=`) and the import path (right) both derive from
# the package name; update both if you rename the project.
[project.scripts]
wac_homekit = "wac_homekit.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wac_homekit"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "mypy>=1.0",
]

[tool.uv.workspace]
members = ["libs/*"]

[tool.uv.sources]
wac-iot = { workspace = true }

[tool.mypy]
files = ["src", "libs"]
strict = true

# HAP-python ships no py.typed marker, so everything it exports is Any.
[[tool.mypy.overrides]]
module = ["pyhap.*"]
ignore_missing_imports = true

# ... which makes Accessory and Bridge Any-typed bases. Subclassing them is the
# only way to use HAP-python at all, so the two modules that do get the strict
# rule relaxed. Nothing else in the tree may subclass an untyped base.
[[tool.mypy.overrides]]
module = ["wac_homekit.accessory", "wac_homekit.driver"]
disallow_subclassing_any = false

[tool.pytest.ini_options]
# importlib mode keeps test modules out of sys.path games — required once two
# workspace members each have their own `tests/` tree with colliding basenames.
addopts = "--import-mode=importlib"
testpaths = ["tests", "libs/wac_iot/tests"]
