[project]
name = "wac_iot"
version = "0.1.0"
description = "Client library for WAC Lighting IoT devices"
authors = [
    { name = "Bruce Oberg", email = "bruce@oberg.org" }
]
readme = "README.md"
license = "MIT"
# Copied rather than referenced: the repository root's LICENSE is outside this
# package's build root, so it would not travel into the wheel.
license-files = ["LICENSE"]
keywords = ["wac", "lighting", "iot", "homekit", "home-assistant", "mdns"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.9",
    "pydantic>=2.13.4",
]

# The library lives in a subdirectory of the bridge's repo, which is what
# these all point at until it is lifted out on its own.
[project.urls]
Homepage = "https://github.com/bruceoberg/wac_homekit"
Repository = "https://github.com/bruceoberg/wac_homekit"
Issues = "https://github.com/bruceoberg/wac_homekit/issues"

# Shipping a console script from a library is slightly impure, but debugging
# the device layer without the bridge in the way is worth it.
[project.scripts]
wac_iot = "wac_iot.cli:main"

# Only CBrowser needs zeroconf. A consumer with its own mDNS stack — Home
# Assistant hands every integration a shared instance — installs the bare
# package and calls DiscoFromTxt, rather than dragging a second Zeroconf into
# the process.
[project.optional-dependencies]
discovery = [
    "zeroconf>=0.132",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wac_iot"]

# The sdist otherwise ships this package's agent rules, which are a working
# document and would read as documentation to anyone who found them in a
# tarball. (.gitignore comes along regardless — hatchling always includes it.)
[tool.hatch.build.targets.sdist]
exclude = [".claude"]
