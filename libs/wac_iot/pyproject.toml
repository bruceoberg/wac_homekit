[project]
name = "wac_iot"
version = "0.1.0"
description = "Client library for WAC Lighting IoT devices"
authors = [
    { name = "Bruce Oberg", email = "bruce@oberg.org" }
]
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.9",
    "pydantic>=2.13.4",
]

# Shipping a console script from a library is slightly impure, but debugging
# the device layer without the bridge in the way is worth it.
[project.scripts]
wac_iot = "wac_iot.cli:main"

# Only CBrowser needs zeroconf. A consumer with its own mDNS stack — Home
# Assistant hands every integration a shared instance — installs the bare
# package and calls DiscoFromTxt, rather than dragging a second Zeroconf into
# the process.
[project.optional-dependencies]
discovery = [
    "zeroconf>=0.132",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wac_iot"]
