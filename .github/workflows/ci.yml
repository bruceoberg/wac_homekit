name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync

      # Covers both workspace members — see [tool.mypy] files in pyproject.toml.
      - name: Type-check
        run: uv run mypy

      # No install step: `uv sync` above brings in the `dev` group by default,
      # which is where pytest lives. No arguments either — `testpaths` in the
      # root pyproject.toml already covers both workspace members.
      - name: Test
        run: uv run pytest

      # --all-packages so wac_iot is built too, not just the root project.
      - name: Build
        run: uv build --all-packages

# NOTE(bruce) what CI does not cover: the suite is pure functions only —
# conversions, tier selection, interface and persist-directory resolution, the
# setup payload, the status line. Everything about the device layer and the
# HomeKit layer needs real hardware and a real Home app (`just dump`, and the
# verification notes in .claude/CLAUDE.md), which no runner can provide.
