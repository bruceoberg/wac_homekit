name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync

      # Covers both workspace members — see [tool.mypy] files in pyproject.toml.
      - name: Type-check
        run: uv run mypy

      # --all-packages so wac_iot is built too, not just the root project.
      - name: Build
        run: uv build --all-packages

# NOTE(bruce) no pytest step: the suite covers pure functions and runs locally
# via `just test`. Device-layer verification needs real hardware (`just dump`).
